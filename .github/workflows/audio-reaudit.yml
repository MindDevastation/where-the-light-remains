name: Audio Reaudit

on:
  push:
    branches:
      - analysis/audio-reaudit
    paths:
      - 'tools/audio_reaudit.py'
      - '.github/workflows/audio-reaudit.yml'
      - 'music/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-reaudit-analysis
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sparse checkout current music
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/audio_reaudit.py
            music/**
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install numpy scipy soundfile librosa 'transformers==4.47.1' sentencepiece

      - name: Run repeat audit
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python tools/audio_reaudit.py

      - name: Upload audit data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-reaudit
          path: audio_reaudit_output/
          if-no-files-found: warn
