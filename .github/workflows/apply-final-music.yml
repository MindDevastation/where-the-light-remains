name: Apply Final Music Structure

on:
  push:
    branches:
      - audio/final-pool-structure
    paths:
      - '.github/workflows/apply-final-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout music only
        uses: actions/checkout@v4
        with:
          ref: audio/final-pool-structure
          fetch-depth: 1
          sparse-checkout: |
            music
            .github/workflows/apply-final-music.yml
          sparse-checkout-cone-mode: true

      - name: Reorganize curated music
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            'music/A_Archive/shared' \
            'music/A_Archive/stages/S00_Prologue/unique' \
            'music/A_Archive/stages/S00_Prologue/supplemental' \
            'music/A_Archive/stages/S01_Hub/unique' \
            'music/A_Archive/stages/S10_Return/unique' \
            'music/A_Archive/stages/S11_Order_of_Light/unique' \
            'music/B_Wings/shared' \
            'music/B_Wings/stages/S02_Warmth_Light/unique' \
            'music/B_Wings/stages/S03_Life_Voice/unique' \
            'music/C_Memories/shared' \
            'music/C_Memories/stages/S04_First_Meeting/unique' \
            'music/C_Memories/stages/S06_Egg/unique' \
            'music/D_Playful/shared' \
            'music/D_Playful/stages/S05_Laughter_Lightness/unique' \
            'music/D_Playful/stages/S07_Seriousness_Smile/unique' \
            'music/E_Emotional/shared' \
            'music/E_Emotional/stages/S08_Sincerity_Admiration/unique' \
            'music/E_Emotional/stages/S09_Future_Memory/unique' \
            'music/E_Emotional/stages/S12_Poem/unique' \
            'music/E_Emotional/stages/S13_Acrostic/unique' \
            'music/E_Emotional/stages/S14_Confession/unique' \
            'music/E_Emotional/stages/S15_Dawn/unique' \
            'music/E_Emotional/stages/S15_Dawn/supplemental'

          # Group A shared pool + uniques
          git mv 'music/A_Archive/S01_Hub/Hub Motif.wav' 'music/A_Archive/shared/Hub Motif.wav'
          git mv 'music/A_Archive/S11_Order_of_Light/Mechanism Light.wav' 'music/A_Archive/shared/Mechanism Light.wav'
          git mv 'music/A_Archive/S11_Order_of_Light/Activation Sequence.wav' 'music/A_Archive/shared/Activation Sequence.wav'
          git mv 'music/Archive Fragment.wav' 'music/A_Archive/shared/Archive Fragment.wav'
          git mv 'music/Resonant Puzzle.wav' 'music/A_Archive/shared/Resonant Puzzle.wav'
          git mv 'music/Sparse Awakening vol.2.wav' 'music/A_Archive/stages/S00_Prologue/unique/Sparse Awakening vol.2.wav'
          git mv 'music/Sparse Awakening.wav' 'music/A_Archive/stages/S00_Prologue/supplemental/Sparse Awakening.wav'
          git mv 'music/A_Archive/S01_Hub/Archive Awakening.wav' 'music/A_Archive/stages/S01_Hub/unique/Archive Awakening.wav'
          git mv 'music/A_Archive/S10_Return/The Light Path.wav' 'music/A_Archive/stages/S10_Return/unique/The Light Path.wav'
          git mv 'music/A_Archive/S11_Order_of_Light/Resonant Assembly.wav' 'music/A_Archive/stages/S11_Order_of_Light/unique/Resonant Assembly.wav'

          # Group B shared pool + uniques
          git mv 'music/B_Wings/S03_Life_Voice/024_Silent Roads Beneath the Frost.wav' 'music/B_Wings/shared/024_Silent Roads Beneath the Frost.wav'
          git mv 'music/B_Wings/S03_Life_Voice/034_Muted Pulse Under Falling White.wav' 'music/B_Wings/shared/034_Muted Pulse Under Falling White.wav'
          git mv 'music/B_Wings/S03_Life_Voice/080_Quiet Exhale Through Evergreens.wav' 'music/B_Wings/shared/080_Quiet Exhale Through Evergreens.wav'
          git mv 'music/B_Wings/S02_Warmth_Light/Cold to Warm.wav' 'music/B_Wings/stages/S02_Warmth_Light/unique/Cold to Warm.wav'
          git mv 'music/B_Wings/S03_Life_Voice/029_Cold Arterial Glow.wav' 'music/B_Wings/stages/S03_Life_Voice/unique/029_Cold Arterial Glow.wav'

          # Group C shared pool + uniques
          git mv 'music/C_Memories/S04_First_Meeting/048_Horizon Veil.wav' 'music/C_Memories/shared/048_Horizon Veil.wav'
          git mv 'music/Remembered Stone Room.wav' 'music/C_Memories/stages/S04_First_Meeting/unique/Remembered Stone Room.wav'
          git mv 'music/Curious Sneaking Groove.wav' 'music/C_Memories/stages/S06_Egg/unique/Curious Sneaking Groove.wav'
          git mv 'music/The Great Dodging Dash.wav' 'music/C_Memories/stages/S06_Egg/unique/The Great Dodging Dash.wav'

          # Group D shared pool + uniques
          git mv 'music/D_Playful/S05_Laughter_Lightness/Wooden Hall Puzzle v2.wav' 'music/D_Playful/shared/Wooden Hall Puzzle v2.wav'
          git mv 'music/E_Emotional/S07_Seriousness_Smile/Quiet Corridor in Dusk.wav' 'music/D_Playful/shared/Quiet Corridor in Dusk.wav'
          git mv 'music/Buant Motion.wav' 'music/D_Playful/stages/S05_Laughter_Lightness/unique/Buant Motion.wav'
          git mv 'music/Controlled Tails.wav' 'music/D_Playful/stages/S07_Seriousness_Smile/unique/Controlled Tails.wav'

          # Group E shared pool + uniques
          git mv 'music/E_Emotional/S09_Future_Memory/Quiet Exploration.wav' 'music/E_Emotional/shared/Quiet Exploration.wav'
          git mv 'music/Stone Chamber Echoes.wav' 'music/E_Emotional/shared/Stone Chamber Echoes.wav'
          git mv 'music/Glass and Wind.wav' 'music/E_Emotional/shared/Glass and Wind.wav'
          git mv 'music/Observatory Dawn.wav' 'music/E_Emotional/shared/Observatory Dawn.wav'
          git mv 'music/E_Emotional/S08_Sincerity_Admiration/Candlelight Over Ledger Pages.wav' 'music/E_Emotional/stages/S08_Sincerity_Admiration/unique/Candlelight Over Ledger Pages.wav'
          git mv 'music/Unresolved Breath.wav' 'music/E_Emotional/stages/S09_Future_Memory/unique/Unresolved Breath.wav'
          git mv 'music/E_Emotional/S12_Poem/Quiet Pages, Steady Light.wav' 'music/E_Emotional/stages/S12_Poem/unique/Quiet Pages, Steady Light.wav'
          git mv 'music/E_Emotional/S13-14_Reveal_Confession/Final Quiet of the Archive.wav' 'music/E_Emotional/stages/S13_Acrostic/unique/Final Quiet of the Archive.wav'
          git mv 'music/Silent Piano.wav' 'music/E_Emotional/stages/S14_Confession/unique/Silent Piano.wav'
          git mv 'music/Starlit Motif.wav' 'music/E_Emotional/stages/S15_Dawn/unique/Starlit Motif.wav'
          git mv 'music/Pre-dawn Hush.wav' 'music/E_Emotional/stages/S15_Dawn/supplemental/Pre-dawn Hush.wav'
          git mv 'music/Quiet Hope.wav' 'music/E_Emotional/stages/S15_Dawn/supplemental/Quiet Hope.wav'

          # Remove tracks made obsolete by the repeat audit
          git rm \
            'music/A_Archive/S11_Order_of_Light/012_April Snow Drift.wav' \
            'music/B_Wings/S03_Life_Voice/Resonant Silence.wav' \
            'music/E_Emotional/S09_Future_Memory/084_Snowfield in D Minor.wav' \
            'music/E_Emotional/S15_Dawn/018_April Snow Drift.wav' \
            'music/E_Emotional/S15_Dawn/070_Moss Thaw.wav' \
            'music/E_Emotional/S15_Dawn/076_Rain on Moss.wav' \
            'music/E_Emotional/S15_Dawn/082_Felt Moonlight in C.wav' \
            'music/E_Emotional/S15_Dawn/099_Thawing Window.wav'

          cat > music/MUSIC_INDEX.md <<'EOF'
          # Music Library Index

          Status: **curated runtime structure applied after the 2026-09-19 repeat audit**.

          Core rule: each music group owns one shared pool used by every stage in that group, and every stage has a dedicated unique cue. Scripted scenes may temporarily lock out shuffle playback while remaining members of their group.

          ## Group ownership
          - **A — Archive / Observatory:** Stages 0, 1, 10, 11
          - **B — Warmth / Voice:** Stages 2, 3
          - **C — Raid Memories:** Stages 4, 6
          - **D — Lightness / Contrast:** Stages 5, 7
          - **E — Sincerity / Future / Finale:** Stages 8, 9, 12, 13, 14, 15

          ## A — Archive / Observatory
          Shared pool: `Hub Motif`, `Mechanism Light`, `Activation Sequence`, `Archive Fragment`, `Resonant Puzzle`.

          Unique cues:
          - S00: `Sparse Awakening vol.2` (supplemental: `Sparse Awakening`)
          - S01: `Archive Awakening`
          - S10: `The Light Path`
          - S11: `Resonant Assembly`

          `Archive Fragment` and `Resonant Puzzle` are intentionally retained and integrated into the A shared pool despite their lower repeat-audit ranking, per project direction.

          ## B — Warmth / Voice
          Shared pool: `024_Silent Roads Beneath the Frost`, `034_Muted Pulse Under Falling White`, `080_Quiet Exhale Through Evergreens`.

          Unique cues:
          - S02: `Cold to Warm`
          - S03: `029_Cold Arterial Glow`

          ## C — Raid Memories
          Shared pool: `048_Horizon Veil`.

          Unique cues:
          - S04: `Remembered Stone Room`
          - S06: `Curious Sneaking Groove` (stealth) + `The Great Dodging Dash` (chase). Stage 6 is the intentional two-cue exception.

          ## D — Lightness / Contrast
          Shared pool: `Wooden Hall Puzzle v2`, `Quiet Corridor in Dusk`.

          Unique cues:
          - S05: `Buant Motion`
          - S07: `Controlled Tails`

          ## E — Sincerity / Future / Finale
          Shared pool: `Quiet Exploration`, `Stone Chamber Echoes`, `Glass and Wind`, `Observatory Dawn`.

          Unique cues:
          - S08: `Candlelight Over Ledger Pages`
          - S09: `Unresolved Breath`
          - S12: `Quiet Pages, Steady Light`
          - S13: `Final Quiet of the Archive`
          - S14: `Silent Piano`
          - S15: `Starlit Motif` (supplemental scripted chain: `Pre-dawn Hush` → `Quiet Hope` → `Starlit Motif`)

          ## Runtime rule
          Normal exploration stages play the unique cue first, then rotate through the group's shared pool via shuffle bag. No immediate repeats. Calm scenes may use 3–10 seconds of ambience-only breathing room between tracks. Typical crossfade is 4–7 seconds; active cues use 1.5–3 seconds.

          Scripted exceptions:
          - S06 locks music to stealth → silence/event → chase → rescue.
          - S12–S15 use deterministic music during critical narrative beats; the E shared pool remains available only outside those locked moments.
          - S14 forces 4–6 seconds of complete music silence after `Я люблю тебя`.

          See `MUSIC_RUNTIME_POLICY.md` for the full playback contract.

          ## Removed after repeat audit
          `012_April Snow Drift`, `Resonant Silence`, `084_Snowfield in D Minor`, `018_April Snow Drift`, `070_Moss Thaw`, `076_Rain on Moss`, `082_Felt Moonlight in C`, `099_Thawing Window`.

          Removed files remain recoverable from Git history.
          EOF

          cat > music/MUSIC_RUNTIME_POLICY.md <<'EOF'
          # Music Runtime Policy

          ## Core model
          `Stage = GroupSharedPool + UniqueCue`

          Every stage belongs to exactly one group. The exact same `shared/` pool is available to every stage inside that group. Each stage also owns a `unique/` cue that establishes its identity.

          ## Normal exploration playback
          1. Play the stage unique cue first unless a scripted silence/event owns the opening.
          2. Then build a shuffle bag from the stage group's `shared/` directory.
          3. Do not repeat a shared track until the current bag is exhausted.
          4. Never allow immediate repetition across bag boundaries.
          5. After one full shared-pool cycle, the stage unique cue may re-enter rotation with a higher weight than one shared cue.
          6. Supplemental tracks are stage-local and only enter rotation when explicitly enabled.

          Recommended weights after the guaranteed first unique play:
          - shared cue: `1.0`
          - stage unique cue: `2.0`
          - supplemental cue: `0.5–1.0`

          ## Silence and transitions
          Calm exploration:
          - ambience-only gap: random `3–10 s` when scene timing allows;
          - crossfade: `4–7 s`;
          - avoid starting a fresh long track immediately before a known puzzle resolution or cinematic lock.

          Active states:
          - crossfade: `1.5–3 s`;
          - no random ambience gap during chase or momentum-critical sequences.

          Canonical Audio Direction silence always overrides playlist behavior.

          ## Suggested AudioDirector states
          General: `exploration`, `puzzle`, `solved`, `cinematic`, `silence`.

          S06: `egg_stealth`, `egg_pickup_silence`, `boss_wake`, `egg_chase`, `rescue`.

          Finale: `poem`, `acrostic`, `confession_pre`, `confession_silence`, `pre_dawn`, `dawn`, `morning`, `final_wide`.

          ## Scripted overrides
          ### Stage 6 — Egg
          `Group C calm pool → Curious Sneaking Groove → mandatory egg-pickup silence → The Great Dodging Dash → rescue transition`.
          Shared Group C music must not restart during the chase.

          ### Stage 12 — Poem
          Group E remains the parent group, but `Quiet Pages, Steady Light` owns the poem state. Fade toward silence at the end.

          ### Stage 13 — Acrostic
          `Final Quiet of the Archive` owns the stage. Preserve the planned silence after the full acrostic.

          ### Stage 14 — Confession
          `Silent Piano` owns the stage. On `Я люблю тебя`, force music to zero and hold **4–6 seconds of complete music silence**. Shuffle playback cannot resume inside this window.

          ### Stage 15 — Dawn
          Preferred deterministic chain: `Pre-dawn Hush → Quiet Hope → Starlit Motif → optional Glass and Wind / ambience tail`.
          `Starlit Motif` is the formal unique cue. Group E shared tracks must not interrupt the authored dawn chain.

          ## Future data shape
          ```yaml
          group: A|B|C|D|E
          unique_track: path
          supplemental_tracks: []
          unique_first: true
          unique_rotation_weight: 2.0
          shared_rotation_weight: 1.0
          silence_min_seconds: 3
          silence_max_seconds: 10
          crossfade_seconds: 6
          scripted_only: false
          ```

          `AudioDirector` owns all playlist selection, crossfades and silence locks. Scene scripts request music states; they do not directly own music players.
          EOF

          git rm .github/workflows/apply-final-music.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply final music pools and stage structure'
          git push origin HEAD:audio/final-pool-structure
