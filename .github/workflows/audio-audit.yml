name: Audio Audit

on:
  push:
    branches:
      - analysis/audio-audit
    paths:
      - 'tools/audio_audit.py'
      - '.github/workflows/audio-audit.yml'
      - 'music/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile librosa pyloudnorm torch transformers sentencepiece

      - name: Run full audio audit
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python tools/audio_audit.py

      - name: Upload audit data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-audit-output
          path: audio_audit_output/
          if-no-files-found: warn
