name: Audio Audit

on:
  push:
    branches:
      - analysis/audio-audit
    paths:
      - 'tools/audio_audit.py'
      - '.github/workflows/audio-audit.yml'
      - 'music/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-audit-analysis
  cancel-in-progress: true

jobs:
  audit:
    name: audit-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sep26
            sparse: |
              tools/audio_audit.py
              music/Sep26/*
              music/Resonant Assembly.wav
          - name: feb26
            sparse: |
              tools/audio_audit.py
              music/Feb26/*
          - name: apr01-29
            sparse: |
              tools/audio_audit.py
              music/Apr26/0[0-2][0-9]_*.wav
          - name: apr30-59
            sparse: |
              tools/audio_audit.py
              music/Apr26/0[3-5][0-9]_*.wav
          - name: apr60-89
            sparse: |
              tools/audio_audit.py
              music/Apr26/0[6-8][0-9]_*.wav
          - name: apr90-100
            sparse: |
              tools/audio_audit.py
              music/Apr26/09[0-9]_*.wav
              music/Apr26/100_*.wav
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sparse checkout audio shard
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: ${{ matrix.sparse }}
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile librosa pyloudnorm torch transformers sentencepiece

      - name: Run audio audit
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python tools/audio_audit.py

      - name: Upload audit data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-audit-${{ matrix.name }}
          path: audio_audit_output/
          if-no-files-found: warn
